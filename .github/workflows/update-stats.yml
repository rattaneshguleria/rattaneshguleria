name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate total stars
        id: stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL_STARS=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/user/repos?per_page=100&affiliation=owner" \
            --jq '.[].stargazers_count' \
            | awk '{sum += $1} END {print sum+0}')

          echo "TOTAL_STARS=$TOTAL_STARS" >> "$GITHUB_OUTPUT"
          echo "Total Stars: $TOTAL_STARS"

      - name: Update README
        env:
          TOTAL_STARS: ${{ steps.stars.outputs.TOTAL_STARS }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          stars = os.environ["TOTAL_STARS"]

          text = re.sub(
              r'(<!-- TOTAL_STARS_START -->).*?(<!-- TOTAL_STARS_END -->)',
              rf'\1{stars}\2',
              text,
              flags=re.DOTALL
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update total stars"
            git push
          fi
